version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/ml/models:/app/ml/models
    environment:
      STREAM_RATE: "2"
      MODEL_TYPE: "auto"
      DATA_DIR: "./data/cicddos2019"
      MODEL_DIR: "./ml/models"
    # Trains only if model.joblib doesn't exist (handled in startup)
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_WS_URL: "ws://backend:8000/ws/attacks"
      NEXT_PUBLIC_API_URL: "http://backend:8000"
    depends_on:
      backend:
        condition: service_healthy
